<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasolineras baratas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gasolina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a7d3b'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%E2%9B%BD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--mut:#666;--ac:#0a7d3b}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--fg:#eee;--card:#23262b;--mut:#9aa;--ac:#3ddc84}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column}
header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card)}
select,button{padding:8px;border-radius:8px;border:1px solid #8884;background:var(--bg);color:var(--fg);font-size:14px}
button{background:var(--ac);color:#fff;border:0;font-weight:600}
#map{flex:1;min-height:240px}
#list{max-height:38%;overflow:auto;padding:8px}
.it{background:var(--card);border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.it b{font-size:18px;color:var(--ac)}
.it small{color:var(--mut)}
.up{color:#d33}.down{color:#1a9d4a}
#st{padding:4px 10px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header style="padding-top:max(10px,env(safe-area-inset-top))">
  <select id="fuel">
    <option value="Precio Gasolina 95 E5">Gasolina 95</option>
    <option value="Precio Gasolina 98 E5">Gasolina 98</option>
    <option value="Precio Gasoleo A">Diésel</option>
    <option value="Precio Gasoleo Premium">Diésel premium</option>
  </select>
  <select id="rad">
    <option value="5">5 km</option><option value="10" selected>10 km</option>
    <option value="20">20 km</option><option value="50">50 km</option>
  </select>
  <button id="go">Buscar cerca de mí</button>
</header>
<div id="st">Pulsa «Buscar cerca de mí»</div>
<div id="map"></div>
<div id="list"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const API="https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/";
const map=L.map("map").setView([40.4,-3.7],6);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri"}).addTo(map);
let layer=L.layerGroup().addTo(map),data=null,me=null;
const num=s=>parseFloat(String(s||"").replace(",","."));
const $=id=>document.getElementById(id);
function km(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
 const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function prev(){try{return JSON.parse(localStorage.getItem("prev")||"{}")}catch(e){return{}}}
async function load(){
  $("st").textContent="Descargando precios oficiales…";
  const u=encodeURIComponent(API);
  const rutas=[API,
    "https://corsproxy.io/?"+u,
    "https://api.allorigins.win/raw?url="+u,
    "https://api.codetabs.com/v1/proxy?quest="+API];
  let ultimo;
  for(const r of rutas){
    try{
      const res=await fetch(r);
      if(!res.ok)throw new Error("HTTP "+res.status);
      const j=await res.json();
      data=j.ListaEESSPrecio;
      $("st").textContent="Datos del Ministerio: "+j.Fecha;
      return;
    }catch(e){ultimo=e;}
  }
  throw ultimo;
}
async function search(){
  if(!me){
    try{
      const p=await new Promise((ok,ko)=>{
        if(!navigator.geolocation)return ko({message:"sin soporte"});
        navigator.geolocation.getCurrentPosition(ok,ko,{enableHighAccuracy:false,timeout:10000});
      });
      me=[p.coords.latitude,p.coords.longitude];
    }catch(e){
      $("st").textContent="No he podido obtener tu ubicación ("+(e.message||"permiso denegado")+"). Toca en el mapa el sitio donde estás.";
      return;
    }
  }
  try{
    if(!data)await load();
    draw();
  }catch(e){
    $("st").textContent="No se pudieron descargar los precios del Ministerio ("+(e.message||e)+").";
  }
}
map.on("click",e=>{me=[e.latlng.lat,e.latlng.lng];search()});
function draw(){
  const f=$("fuel").value,rad=+$("rad").value,pv=prev(),old=pv[f]||{};
  const res=data.map(s=>({s,p:num(s[f]),lat:num(s["Latitud"]),lon:num(s["Longitud (WGS84)"])}))
   .filter(o=>o.p>0&&!isNaN(o.lat))
   .map(o=>({...o,d:km(me[0],me[1],o.lat,o.lon)}))
   .filter(o=>o.d<=rad).sort((a,b)=>a.p-b.p);
  layer.clearLayers();$("list").innerHTML="";
  L.circleMarker(me,{radius:8,color:"#2563eb",fillOpacity:.9}).addTo(layer).bindPopup("Tú");
  const bounds=[me];
  res.forEach((o,i)=>{
    const id=o.s["IDEESS"],was=old[id];
    let tr="";
    if(was){const dif=o.p-was;if(Math.abs(dif)>.0004)tr=dif>0?`<span class="up">▲ ${dif.toFixed(3)}</span>`:`<span class="down">▼ ${Math.abs(dif).toFixed(3)}</span>`}
    const col=i==0?"#0a7d3b":i<3?"#e8a100":"#888";
    const m=L.circleMarker([o.lat,o.lon],{radius:i==0?11:7,color:col,fillColor:col,fillOpacity:.85}).addTo(layer);
    m.bindPopup(`<b>${o.s["Rótulo"]}</b><br>${o.p.toFixed(3)} €/L<br>${o.s["Dirección"]}<br>${o.s["Horario"]}`);
    bounds.push([o.lat,o.lon]);
    const el=document.createElement("div");el.className="it";
    el.innerHTML=`<div><b>${o.p.toFixed(3)} €</b> ${tr}<br>${o.s["Rótulo"]}<br><small>${o.s["Dirección"]}, ${o.s["Localidad"]} · ${o.d.toFixed(1)} km</small></div>
     <a href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lon}" target="_blank" onclick="event.stopPropagation()">Ir</a>`;
    el.onclick=()=>{map.setView([o.lat,o.lon],15);m.openPopup()};
    $("list").appendChild(el);
  });
  if(!res.length)$("list").textContent="No hay gasolineras en ese radio.";
  map.fitBounds(bounds,{padding:[30,30]});
  const nw={};data.forEach(s=>{const p=num(s[f]);if(p>0)nw[s["IDEESS"]]=p});
  pv[f]=nw;try{localStorage.setItem("prev",JSON.stringify(pv))}catch(e){}
}
$("go").onclick=search;
$("fuel").onchange=()=>data&&me&&draw();
$("rad").onchange=()=>data&&me&&draw();
</script>
</body>
</html>
